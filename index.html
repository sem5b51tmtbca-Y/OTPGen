<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OTP Generator</title>

    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 20px;
        }

        .panel {
            background: white;
            max-width: 480px;
            margin: 30px auto;
            padding: 18px;
            border-radius: 6px;
            box-shadow: 0 0 10px rgba(0,0,0,0.15);
        }

        .panel-large {
            max-width: 650px;
        }

        .row {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        label {
            width: 95px;
            font-weight: bold;
            flex-shrink: 0;
        }

        input[type="text"],
        input[type="password"] {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            min-width: 0;
        }

        .gradient-button {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            border: 2px solid rgb(0,70,140);
            border-radius: 6px;
            background: rgb(0,70,140);
        }

        .gradient-button:hover {
            background: rgb(0,90,170);
        }
        /* OTP Generate and Clear button layout */
        .button-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }

        .button-row .gradient-button {
            width: 160px;
        }

        .otp-layout {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .otp-input-section {
            flex: 1;
            min-width: 0;
        }

        .otp-row {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .otp-row label {
            width: 65px;
        }

        .qr-picture-box {
            width: 170px;
            height: 170px;
            border: 1px solid #ccc;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            box-sizing: border-box;
            flex-shrink: 0;
            overflow: hidden;
        }

        #qrcode {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #appPanel {
            display: none;
        }

        @media (max-width: 520px) {
            .otp-layout {
                flex-direction: column;
            }

            .otp-input-section {
                width: 100%;
            }
        }

    .password-wrapper {
    display: flex;
    align-items: center;
    border: 1px solid #ccc;
    border-radius: 4px;
    overflow: hidden;
}

.password-wrapper input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
}

.password-wrapper button {
    background: white;
    border: none;
    cursor: pointer;
    padding: 8px;
}
    </style>
</head>

<body>

    <!-- LOGIN PANEL -->
    <div class="panel" id="loginPanel">

        <h3 style="text-align:center">Login</h3>

        <div class="row">
            <label>User:</label>
            <input type="text" id="loginUser">
        </div>

        <div class="row">
            <label>Password:</label>
            <input type="password" id="loginPass">
             <button type="button" onclick="togglePassword()">👁</button>
            
        </div>
   

        <button class="gradient-button" onclick="login()">
            Login
        </button>

    </div>


    <!-- OTP GENERATOR PANEL -->
    <div class="panel panel-large" id="appPanel">

        <h3 style="text-align:center">OTP Generator</h3>

        <div class="otp-layout">

            <div class="otp-input-section">

                <!-- MACHINE ID -->
                <div class="otp-row">
                    <label>ID :</label>
                    <input
                        type="text"
                        id="TxtMachinID"
                        placeholder="Enter Machine ID"
                        oninput="updateQRCode()">
                </div>

                <!-- GENERATED OTP -->
                <div class="otp-row">
                    <label>OTP :</label>
                    <input
                        type="text"
                        id="TxtKey"
                        readonly>
                </div>

                <!-- GENERATE BUTTON -->
              <div class="button-row">

                   <button class="gradient-button" onclick="generateOTP()">
                   OTP Generate
                  </button>

                   <button class="gradient-button" onclick="clearFields()">
                   Clear
                  </button>

              </div>

            </div>

            <!-- QR CODE PICTURE BOX -->
            <div class="qr-picture-box" id="PictureBoxQR">
                <div id="qrcode"></div>
            </div>

        </div>

    </div>


    <script>

        // =====================================
        // LOGIN DETAILS
        // =====================================

        const USERNAME = "Unipro007";
        const PASSWORD = "UniproService@2007";


        // =====================================
        // LOGIN FUNCTION
        // =====================================

        function login() {

            const u = document.getElementById("loginUser").value.trim();
            const p = document.getElementById("loginPass").value.trim();

            if (u === USERNAME && p === PASSWORD) {

                // save login in browser
              localStorage.setItem("OTPGen_savedUser", u);
              localStorage.setItem("OTPGen_savedPass", p);

                document.getElementById("loginPanel").style.display = "none";
                document.getElementById("appPanel").style.display = "block";

            } else {

                alert("Invalid username or password");

            }
        }
       function togglePassword() {
    const password = document.getElementById("loginPass");

    password.type = password.type === "password" ? "text" : "password";
}
        // =====================================
        // GET CURRENT TIME SLOT
        // SAME AS C# DateTime.Now.ToString("HH")
        // =====================================

        function getCurrentTimeSlot() {

            const now = new Date();

            return String(now.getHours()).padStart(2, "0");
        }


        // =====================================
        // GENERATE QR CODE
        // SAME AS C# GenerateQRCode()
        // =====================================

        function updateQRCode() {

            const machineID = document.getElementById("TxtMachinID").value.trim();

            const qrBox = document.getElementById("qrcode");

            qrBox.innerHTML = "";

            if (machineID === "") {
                return;
            }

            if (typeof QRCode === "undefined") {
                qrBox.textContent = "QR library unavailable";
                return;
            }

            new QRCode(qrBox, {
                text: machineID,
                width: 150,
                height: 150,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.Q
            });
        }


        // =====================================
        // GET SHORT MACHINE ID
        // SAME AS C# GetShortMachineID()
        // =====================================

        function getShortMachineID(shortMachineID) {

            if (!shortMachineID || shortMachineID.length < 4) {
                return "";
            }

            const thirdDigit = shortMachineID.substring(2, 3);

            const lastFourDigits = shortMachineID.substring(
                shortMachineID.length - 4
            );

            return thirdDigit + lastFourDigits;
        }

        function clearFields() {
             document.getElementById("TxtMachinID").value = "";
             document.getElementById("TxtKey").value = "";

            // Clear QR code if available
            document.getElementById("qrcode").innerHTML = "";
        }

        // =====================================
        // GENERATE CUSTOM KEY
        // SAME AS C# GenerateCustomKey()
        // =====================================

        async function generateCustomKey(machineID) {

            const currentTime = getCurrentTimeSlot();

            const combined = machineID + "|" + currentTime;

            // SHA256 HASH
            const encoder = new TextEncoder();

            const data = encoder.encode(combined);

            const hashBuffer = await crypto.subtle.digest(
                "SHA-256",
                data
            );

            // SAME AS C# BitConverter.ToUInt32(hash, 0)
            // Little Endian = true

            const hashArray = new DataView(hashBuffer);

            const value = hashArray.getUint32(0, true);

            // SAME AS C# value % 1000000, D6
            return String(value % 1000000).padStart(6, "0");
        }


        // =====================================
        // OTP GENERATE BUTTON
        // SAME AS C# button1_Click()
        // =====================================

        async function generateOTP() {

            const fullMachineID = document.getElementById("TxtMachinID").value.trim();

            if (fullMachineID === "") {

                alert("Please enter the MachineID.");
                return;

            }

            if (fullMachineID.length < 4) {

                alert("Machine ID must contain at least 4 characters.");
                return;

            }

            try {

                // Get Short Machine ID
                const machineID = getShortMachineID(fullMachineID);

                // Generate OTP
                const generatedKey = await generateCustomKey(machineID);

                // Display OTP
                document.getElementById("TxtKey").value = generatedKey;

                // Update QR Code
                updateQRCode();

            } catch (error) {

                alert("OTP generation failed. Please use HTTPS or a supported browser.");

                console.error(error);

            }

        }
// Restore saved login information when website opens
window.onload = function () {
    const savedUser = localStorage.getItem("OTPGen_savedUser");
    const savedPass = localStorage.getItem("OTPGen_savedPass");

    if (savedUser && savedPass) {
        document.getElementById("loginUser").value = savedUser;
        document.getElementById("loginPass").value = savedPass;
    }
};
    </script>

</body>
</html>
